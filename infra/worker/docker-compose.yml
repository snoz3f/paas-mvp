services:
  buildkit:
    image: moby/buildkit
    restart: always
    privileged: true
    container_name: buildkit
    networks:
      - infral-build

  worker:
    image: ghcr.io/snoz3f/paas-worker:latest
    restart: always
    environment:
      PORT: 4000
      CONTROL_PLANE_URL: http://api:5001
      WORKER_SECRET: ${WORKER_SECRET}
      NODE_NAME: worker-01
      NODE_IP: worker
      NODE_REGION: de-frankfurt-1
      NODE_PROVIDER: contabo
      BASE_DOMAIN: infral.dev
      BUILDKIT_HOST: docker-container://buildkit
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TRAEFIK_NETWORK: infral
      TERMINAL_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - buildkit
    networks:
      infral-control:
        aliases:
          - worker

networks:
  infral-control:
    external: true
  infral-build:
    external: true
