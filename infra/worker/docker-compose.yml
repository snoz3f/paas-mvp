services:
  buildkit:
    image: moby/buildkit
    restart: always
    privileged: true
    container_name: buildkit
    networks:
      - infral

  worker:
    image: ghcr.io/snoz3f/paas-worker:latest
    restart: always
    environment:
      PORT: 4000
      CONTROL_PLANE_URL: http://api:5001
      WORKER_SECRET: EECI3dzKyckju5qLXL9bZ9fXemgDb4iT
      NODE_NAME: worker-01
      NODE_IP: host.docker.internal
      NODE_REGION: de-frankfurt-1
      NODE_PROVIDER: contabo
      BASE_DOMAIN: infral.dev
      BUILDKIT_HOST: docker-container://buildkit
      REDIS_URL: redis://redis:6379
      TRAEFIK_NETWORK: infral
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - buildkit
    networks:
      - infral

networks:
  infral:
    external: true
