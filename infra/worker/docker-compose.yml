services:
  buildkit:
    image: moby/buildkit
    restart: always
    privileged: true
    container_name: buildkit
    networks:
      - infral

  worker:
    image: ghcr.io/snoz3f/paas-worker:latest
    restart: always
    environment:
      PORT: 4000
      CONTROL_PLANE_URL: http://api:5001
      WORKER_SECRET: EECI3dzKyckju5qLXL9bZ9fXemgDb4iT
      JWT_SECRET: 3Zpw11hNke4PlZNfqKouSV90EXC5U3pE2meeVTshjs2cp6Sj
      NODE_NAME: worker-01
      NODE_IP: host.docker.internal
      NODE_REGION: de-frankfurt-1
      NODE_PROVIDER: contabo
      BASE_DOMAIN: infral.dev
      BUILDKIT_HOST: docker-container://buildkit
      REDIS_URL: redis://redis:6379
      TRAEFIK_NETWORK: infral
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - buildkit
    networks:
      - infral
    labels:
      - traefik.enable=true
      - traefik.http.routers.worker-terminal.rule=Host(`worker.infral.dev`)
      - traefik.http.routers.worker-terminal.entrypoints=websecure
      - traefik.http.routers.worker-terminal.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.worker-terminal.tls.domains[0].main=*.infral.dev
      - traefik.http.routers.worker-terminal.tls.domains[0].sans=infral.dev
      - traefik.http.services.worker-terminal.loadbalancer.server.port=4000

networks:
  infral:
    external: true
