services:
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      infral-control:
        aliases:
          - redis

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: infral
      POSTGRES_USER: infral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infral-control

  api:
    image: ghcr.io/snoz3f/paas-mvp/api:latest
    restart: always
    environment:
      DATABASE_URL: postgresql://infral:${POSTGRES_PASSWORD}@postgres:5432/infral
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5001
      API_URL: https://api.infral.dev
      API_INTERNAL_URL: http://api:5001
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WORKER_SECRET: ${WORKER_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ALLOWED_NODE_NAMES: ${ALLOWED_NODE_NAMES:-worker-01}
      WORKER_PUBLIC_URL: ${WORKER_PUBLIC_URL:-wss://worker.infral.dev}
      FRONTEND_URL: ${FRONTEND_URL}
      GH_CLIENT_ID: ${GH_CLIENT_ID}
      GH_CLIENT_SECRET: ${GH_CLIENT_SECRET}
      GH_CALLBACK_URL: ${GH_CALLBACK_URL}
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      infral-control:
        aliases:
          - api
    labels:
      - traefik.enable=true
      - traefik.docker.network=infral-control
      - traefik.http.routers.api.rule=Host(`api.infral.dev`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.api.tls.domains[0].main=*.infral.dev
      - traefik.http.routers.api.tls.domains[0].sans=infral.dev
      - traefik.http.services.api.loadbalancer.server.port=5001

volumes:
  postgres_data:

networks:
  infral-control:
    external: true
