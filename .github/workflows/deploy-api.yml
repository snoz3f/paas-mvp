name: Deploy API

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint compose for secret literals
        run: bash scripts/check-compose-secrets.sh infra/api/docker-compose.yml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: infra/api/docker-compose.yml
          target: /opt/infral/api
          strip_components: 2

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker pull ghcr.io/${{ github.repository }}/api:latest
            cd /opt/infral/api
            touch .env
            upsert() {
              local key="$1" val="$2"
              [ -n "$val" ] || return 0
              sed -i "/^${key}=/d" .env
              printf '%s=%s\n' "$key" "$val" >> .env
            }
            upsert FRONTEND_URL '${{ secrets.FRONTEND_URL }}'
            upsert GH_CLIENT_ID '${{ secrets.GH_CLIENT_ID }}'
            upsert GH_CLIENT_SECRET '${{ secrets.GH_CLIENT_SECRET }}'
            upsert GH_CALLBACK_URL '${{ secrets.GH_CALLBACK_URL }}'
            upsert WORKER_SECRET '${{ secrets.WORKER_SECRET }}'
            upsert JWT_SECRET '${{ secrets.JWT_SECRET }}'
            upsert POSTGRES_PASSWORD '${{ secrets.POSTGRES_PASSWORD }}'
            upsert REDIS_PASSWORD '${{ secrets.REDIS_PASSWORD }}'
            upsert ENCRYPTION_KEY '${{ secrets.ENCRYPTION_KEY }}'
            upsert ADMIN_EMAILS '${{ secrets.ADMIN_EMAILS }}'
            upsert ALLOWED_NODE_NAMES '${{ secrets.ALLOWED_NODE_NAMES }}'
            docker network create infral-control 2>/dev/null || true
            docker compose up -d --no-deps --force-recreate api
