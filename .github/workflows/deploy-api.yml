name: Deploy API

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint compose for secret literals
        run: bash scripts/check-compose-secrets.sh infra/api/docker-compose.yml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: infra/api/docker-compose.yml
          target: /opt/infral/api
          strip_components: 2

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}/api:latest
            cd /opt/infral/api
            sed -i '/^FRONTEND_URL=/d;/^GH_CLIENT_ID=/d;/^GH_CLIENT_SECRET=/d;/^GH_CALLBACK_URL=/d;/^WORKER_SECRET=/d;/^JWT_SECRET=/d;/^POSTGRES_PASSWORD=/d;/^REDIS_PASSWORD=/d;/^ENCRYPTION_KEY=/d;/^ADMIN_EMAILS=/d;/^ALLOWED_NODE_NAMES=/d' .env 2>/dev/null || true
            echo 'FRONTEND_URL=${{ secrets.FRONTEND_URL }}' >> .env
            echo 'GH_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}' >> .env
            echo 'GH_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}' >> .env
            echo 'GH_CALLBACK_URL=${{ secrets.GH_CALLBACK_URL }}' >> .env
            echo 'WORKER_SECRET=${{ secrets.WORKER_SECRET }}' >> .env
            echo 'JWT_SECRET=${{ secrets.JWT_SECRET }}' >> .env
            echo 'POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}' >> .env
            echo 'REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}' >> .env
            echo 'ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}' >> .env
            echo 'ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}' >> .env
            echo 'ALLOWED_NODE_NAMES=${{ secrets.ALLOWED_NODE_NAMES }}' >> .env
            docker network create infral-control 2>/dev/null || true
            docker compose up -d --force-recreate
